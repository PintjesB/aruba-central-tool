name: Unit tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.55.0
          if ! command -v google-chrome && ! command -v chromium; then
            python -m playwright install --with-deps chromium
          fi
      - run: python -m unittest discover -s tests -v
        env:
          CENTRAL_UI_PREVIEW_DIR: ${{ runner.temp }}/central-ui-preview
      - name: Upload synthetic UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-ui-preview
          path: ${{ runner.temp }}/central-ui-preview
          if-no-files-found: ignore
          retention-days: 7
